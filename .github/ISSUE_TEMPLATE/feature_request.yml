name: Feature request
description: Propose a new feature or behavior change
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please keep the proposal scoped and concrete.
        **v5** takes bug fixes and small upgrades that **don't change how quota is shown**. Ideas that change the display (sidebar, toasts, compact line, command output) are collected for **v6** in [#293](https://github.com/slkiser/opencode-quota/issues/293); you can add yours there instead. Asking for a new provider? Use the **Provider request** form.
        Review `CONTRIBUTING.md` for contribution expectations.
        Please write a short, specific title. Issues missing key details get the `needs info` label and close after 21 days without activity.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and did not find a duplicate request.
          required: true
        - label: I reviewed current behavior on the production released OpenCode version.
          required: true

  - type: dropdown
    id: display_change
    attributes:
      label: Does this change how quota is shown?
      description: For example a new row, color, format, or layout in the sidebar, toasts, compact line, or command output.
      options:
        - No, it doesn't change the display
        - Yes, it changes the display
        - Not sure
    validations:
      required: true

  - type: input
    id: opencode_version
    attributes:
      label: OpenCode version reviewed
      description: Example `2.0.20`
      placeholder: 2.0.20
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the minimal safe change you want.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional, but useful for tradeoffs.

