name: Feature request
description: Propose a new feature or behavior change
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Right now we only fix bugs and make small changes. Got an idea that changes what you see on screen (the sidebar, pop-ups, or the line under the message box)? Add it to [#293](https://github.com/slkiser/opencode-quota/issues/293) instead.
        Want a new provider? Use the **Provider request** form.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you post
      options:
        - label: I searched the existing issues and nobody has asked for this yet.
          required: true
        - label: I checked how it works now on the newest OpenCode.
          required: true

  - type: dropdown
    id: display_change
    attributes:
      label: Does this change what you see on screen?
      description: For example a new row, color, or layout in the sidebar, pop-ups, or the line under the message box.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true

  - type: input
    id: opencode_version
    attributes:
      label: OpenCode version
      description: Example `2.0.20`
      placeholder: 2.0.20
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: A sketch or screenshot helps. Drag it into this box.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Other ideas you thought about (optional)
